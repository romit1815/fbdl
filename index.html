<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fbviddl — Under Maintenance</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, sans-serif;
      color: #172033;
      background: #f1f5ff;
    }

    main {
      width: min(100%, 520px);
      padding: 48px 32px;
      text-align: center;
      background: white;
      border-radius: 20px;
      box-shadow: 0 16px 48px #17203318;
    }

    .icon { font-size: 40px; }
    .brand { color: #315fce; font-weight: 700; }
    h1 { font-size: clamp(28px, 6vw, 38px); }
    p { color: #647087; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🔧</div>
    <div class="brand">fbviddl</div>
    <h1>We’ll be back soon</h1>
    <p>
      fbviddl is currently under maintenance while we make some improvements.
      Please check back soon.
    </p>
    <p>Thank you for your patience.</p>
  </main>
</body>
</html>
